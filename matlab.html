<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>BOSTON — material lab</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b0c0e;color:#dfe3e8;
    font-family:ui-monospace,Menlo,monospace}
  canvas{display:block}
  #hud{position:fixed;left:12px;top:10px;font-size:11px;line-height:1.55;color:#9aa4b0;
    background:rgba(8,10,13,.72);padding:8px 11px;border:1px solid #1d2430;border-radius:5px;
    white-space:pre;pointer-events:none}
  #err{position:fixed;inset:0;display:none;padding:32px;background:#140609;z-index:99;
    overflow:auto;font-size:12px;color:#ff9a9a;white-space:pre-wrap}
</style>
</head>
<body>
<div id="hud">building…</div>
<pre id="err"></pre>
<script>
  // Other agents are editing other modules in this repo; Vite's HMR overlay
  // would cover this page with their transient compile errors. This page only
  // cares about src/gfx/*, so drop the overlay.
  new MutationObserver(() => document.querySelectorAll('vite-error-overlay')
    .forEach(e => e.remove())).observe(document.documentElement, { childList: true, subtree: true });
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
import Assets from '/src/gfx/Assets.js';
import Materials from '/src/gfx/Materials.js';

const qs = new URLSearchParams(location.search);
// Other agents save constantly, so Vite reloads this page a lot. Remember what
// we were looking at so the reload lands back on the same material.
const only = qs.get('only') ?? sessionStorage.getItem('matlab.only') ?? null;
const tod  = parseFloat(qs.get('tod') ?? '12');

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.AgXToneMapping;   // matches the game's AgX post stack
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161a);
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 400);

// Studio IBL — neutral, so any colour cast we see is the material's own.
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;

const key = new THREE.DirectionalLight(0xfff0dc, 2.6);
key.position.set(-6, 9, 11);
const rim = new THREE.DirectionalLight(0x9fc0ff, 1.1);
rim.position.set(9, 3, -8);
const fill = new THREE.HemisphereLight(0xa8c4e8, 0x30302c, 0.35);
scene.add(key, rim, fill);

// Minimal engine context: Materials only needs assets, renderer and settings.
const assets = new Assets();
const ctx = {
  renderer, scene, camera,
  settings: { preset: 'high', anisotropy: 16 },
  time: { timeOfDay: tod, dt: 0, elapsed: 0, frame: 0 },
  bus: { on() {}, emit() {} },
  get: () => undefined,
};
ctx.assets = assets;
await assets.init(ctx);

const materials = new Materials();
const t0 = performance.now();
await materials.init(ctx);
const buildMs = performance.now() - t0;

/** Sphere/box geometry whose UVs are scaled so 1 uv = tileMeters of surface. */
function scaledSphere(r, tile, tileY) {
  const g = new THREE.SphereGeometry(r, 96, 64);
  const uv = g.attributes.uv;
  const su = (2 * Math.PI * r) / tile, sv = (Math.PI * r) / (tileY || tile);
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * su, uv.getY(i) * sv);
  uv.needsUpdate = true;
  return g;
}
function scaledBox(s, tile, tileY) {
  const g = new THREE.BoxGeometry(s, s, s, 1, 1, 1);
  const uv = g.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * (s / tile), uv.getY(i) * (s / (tileY || tile)));
  uv.needsUpdate = true;
  return g;
}
function label(text, w = 2.1) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 96;
  const g = c.getContext('2d');
  g.fillStyle = '#0e1013'; g.fillRect(0, 0, 512, 96);
  g.fillStyle = '#c8d2dd'; g.font = '600 46px ui-monospace, Menlo, monospace';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, 256, 52);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, w * 96 / 512),
    new THREE.MeshBasicMaterial({ map: t, toneMapped: false }));
  return m;
}

const names = materials.names().filter(n => !n.startsWith('_'));

const content = new THREE.Group();
scene.add(content);

function clearContent() {
  for (const o of [...content.children]) {
    content.remove(o);
    o.geometry?.dispose();
    if (o.material?.map?.isCanvasTexture) { o.material.map.dispose(); o.material.dispose(); }
  }
}

/** Single material, real-world scale, on a sphere + cube + flat swatch. */
function focus(name) {
  sessionStorage.setItem('matlab.only', name);
  clearContent();
  const m = materials.get(name);
  const tile = m.userData.tileMeters ?? 1, tileY = m.userData.tileMetersY ?? tile;
  content.add(new THREE.Mesh(scaledSphere(1.4, tile, tileY), m));
  const box = new THREE.Mesh(scaledBox(2.4, tile, tileY), m);
  box.position.set(3.7, 0, -0.4); box.rotation.y = -0.5; box.rotation.x = 0.12;
  content.add(box);
  const pg = new THREE.PlaneGeometry(4.6, 4.6);
  const uv = pg.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * (4.6 / tile), uv.getY(i) * (4.6 / tileY));
  const plane = new THREE.Mesh(pg, m);
  plane.position.set(-4.0, 0, -0.6); plane.rotation.y = 0.55;
  content.add(plane);
  const l = label(name, 4); l.position.set(0, -2.5, 1.6); content.add(l);
  camera.position.set(0, 1.4, 9.4);
  camera.lookAt(0, -0.1, 0);
  render();
}

/** Contact sheet of every material. */
function grid() {
  sessionStorage.removeItem('matlab.only');
  clearContent();
  const cols = 7, gap = 2.5, r = 0.92;
  names.forEach((name, i) => {
    const m = materials.get(name);
    const tile = m.userData.tileMeters ?? 1, tileY = m.userData.tileMetersY ?? tile;
    const cx = (i % cols - (cols - 1) / 2) * gap;
    const cy = -Math.floor(i / cols) * gap;
    const s = new THREE.Mesh(scaledSphere(r, tile, tileY), m);
    s.position.set(cx, cy, 0);
    content.add(s);
    // A cube behind each sphere shows the material on flat, planar UVs too.
    const b = new THREE.Mesh(scaledBox(1.05, tile, tileY), m);
    b.position.set(cx + 0.9, cy + 0.92, -1.2);
    b.rotation.set(0.2, -0.5, 0);
    content.add(b);
    const l = label(name, 1.9);
    l.position.set(cx, cy - 1.22, 0.45);
    content.add(l);
  });
  const rows = Math.ceil(names.length / cols);
  camera.position.set(0, -(rows - 1) * gap / 2 + 0.3, 0.5 + cols * gap * 1.36);
  camera.lookAt(0, -(rows - 1) * gap / 2 + 0.3, 0);
  render();
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  render();
});

function render() {
  materials.update(1 / 60, ctx);
  renderer.render(scene, camera);
}
only ? focus(only) : grid();

const info = renderer.info;
document.getElementById('hud').textContent =
  `materials ${names.length}   textures ${info.memory.textures}\n` +
  `build ${buildMs.toFixed(0)} ms   draws ${info.render.calls}   tris ${info.render.triangles}\n` +
  (only ? `closeup: ${only}` : 'add ?only=<name> for a closeup, &tod=22 for night');

// Manual stepping: the tab is usually backgrounded when an agent drives this.
window.__matlab = {
  materials, scene, camera, renderer, ctx, render, focus, grid,
  names: () => names,
  setTime: (h) => { ctx.time.timeOfDay = h; render(); },
  look: (pos, at) => { camera.position.set(...pos); camera.lookAt(...at); render(); },
  stats: () => ({ textures: info.memory.textures, geometries: info.memory.geometries,
                  draws: info.render.calls, tris: info.render.triangles, buildMs }),
};
</script>
<script>
addEventListener('error', e => {
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent += '\n' + (e.error?.stack || e.message) + '\n';
});
addEventListener('unhandledrejection', e => {
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent += '\nUNHANDLED: ' + (e.reason?.stack || e.reason) + '\n';
});
</script>
</body>
</html>
