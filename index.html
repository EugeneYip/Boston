<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>BOSTON</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#05070c;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    color:#fff;-webkit-font-smoothing:antialiased}
  #app{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;outline:none}
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:#05070c;z-index:9999;transition:opacity .8s ease}
  #boot.gone{opacity:0;pointer-events:none}
  #boot h1{font-size:clamp(48px,11vw,150px);font-weight:800;letter-spacing:-.05em;
    background:linear-gradient(180deg,#fff 30%,#7a8699);-webkit-background-clip:text;
    background-clip:text;color:transparent;line-height:.9}
  #boot .sub{margin-top:8px;font-size:13px;letter-spacing:.42em;color:#5d6a7d;
    text-transform:uppercase;padding-left:.42em}
  #bar{margin-top:44px;width:min(340px,62vw);height:2px;background:#1b2331;overflow:hidden}
  #bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#f0a020,#ffd569);
    transition:width .35s cubic-bezier(.2,.8,.2,1)}
  #stat{margin-top:14px;font-size:11px;letter-spacing:.16em;color:#4a5566;text-transform:uppercase;height:14px}
  #err{position:fixed;inset:0;display:none;padding:40px;background:#0a0407;z-index:10000;
    overflow:auto;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#ff8a8a;white-space:pre-wrap}
</style>
</head>
<body>
  <div id="app"></div>
  <div id="boot">
    <h1>BOSTON</h1>
    <div class="sub">Open World</div>
    <div id="bar"><i></i></div>
    <div id="stat">Initializing</div>
  </div>
  <pre id="err"></pre>
  <script type="module" src="/src/main.js"></script>
  <script>
    window.addEventListener('error', e => {
      const el = document.getElementById('err');
      el.style.display = 'block';
      el.textContent += '\n' + (e.error?.stack || e.message) + '\n';
    });
    window.addEventListener('unhandledrejection', e => {
      const el = document.getElementById('err');
      el.style.display = 'block';
      el.textContent += '\nUNHANDLED: ' + (e.reason?.stack || e.reason) + '\n';
    });
  </script>
</body>
</html>
