<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>BOSTON — model lab</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b0c0e;color:#dfe3e8;
    font-family:ui-monospace,Menlo,monospace}
  #wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;max-width:100%;max-height:100%;image-rendering:auto}
  #hud{position:fixed;left:10px;top:9px;font-size:11px;line-height:1.5;color:#9aa4b0;
    background:rgba(8,10,13,.78);padding:7px 10px;border:1px solid #1d2430;border-radius:5px;
    white-space:pre;pointer-events:none}
  #err{position:fixed;inset:0;display:none;padding:28px;background:#140609;z-index:99;
    overflow:auto;font-size:12px;color:#ff9a9a;white-space:pre-wrap}
</style>
</head>
<body>
<div id="wrap"></div>
<div id="hud">booting…</div>
<pre id="err"></pre>
<script>
  // The shared dev server full-reloads on any agent's save and Vite's overlay
  // would paint another module's transient compile error over this page. This
  // page only cares about src/world/*, so drop the overlay. (Same guard as
  // matlab.html, and for the same reason.)
  new MutationObserver(() => document.querySelectorAll('vite-error-overlay')
    .forEach(e => e.remove())).observe(document.documentElement, { childList: true, subtree: true });
  addEventListener('error', e => {
    const el = document.getElementById('err');
    el.style.display = 'block';
    el.textContent += '\n' + (e.error?.stack || e.message) + '\n';
  });
  addEventListener('unhandledrejection', e => {
    const el = document.getElementById('err');
    el.style.display = 'block';
    el.textContent += '\nUNHANDLED: ' + (e.reason?.stack || e.reason) + '\n';
  });
</script>
<script type="module" src="./lab.js"></script>
</body>
</html>
